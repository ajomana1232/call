<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"><title>호떡카페 전광판</title>
    <style>
        body { background: #fff; color: red; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Arial Black', sans-serif; overflow: hidden; cursor: pointer; }
        #n { font-size: 75vh; font-weight: bold; transition: transform 0.3s; }
        
        /* 5초 동안 눈에 확 띄게 깜빡이는 애니메이션 */
        @keyframes blink-bg { 
            0%, 100% { background: #fff; color: red; } 
            50% { background: #fff; color: #fff; } 
        }
        .active-call { animation: blink-bg 1s linear infinite; } /* 0.5초 간격으로 무한 반복 */
        .pop { transform: scale(1.1); }
    </style>
</head>
<body onclick="initAudio()">
    <div id="n">준비</div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp({databaseURL: "https://hotteok-call-default-rtdb.asia-southeast1.firebasedatabase.app"});
        
        // [수정] 더 안정적이고 평생 안 터지는 구글 서버의 카톡 알림음(딩동) 스타일로 교체했습니다.
        const a = new Audio("https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3");
        
        function initAudio() { 
            document.body.style.background = "#eee";
            setTimeout(()=>document.body.style.background="#fff", 200);
            a.play().catch(e => console.log("준비완료")); 
        }

        firebase.database().ref("data/num").on("value",(s)=>{
            const v=s.val();
            if(v){
                const el = document.getElementById("n");
                const b = document.body;
                
                // [안전장치] 소리가 터져도 숫자는 무조건 먼저 바뀌도록 순서를 맨 위로 올렸습니다.
                el.innerText = v;
                
                // 기존 효과 제거 후 다시 시작
                b.classList.remove("active-call");
                el.classList.remove("pop");
                void b.offsetWidth; // 애니메이션 리셋
                
                // 깜빡이 시작
                b.classList.add("active-call");
                el.classList.add("pop");
                
                // 5초(5000ms) 뒤에 깜빡이 멈춤
                setTimeout(() => {
                    b.classList.remove("active-call");
                    el.classList.remove("pop");
                }, 5000);
                
                // 소리 재생 (에러 나도 숫자 멈추지 않음)
                a.play().catch(()=>{}); 
            }
        });
    </script>
</body>
</html>
